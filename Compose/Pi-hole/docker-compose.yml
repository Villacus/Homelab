services:
  unbound:
    container_name: unbound
    image: klutchell/unbound:latest
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    volumes:
      - ${UNBOUND_PATH}/config:/etc/unbound/
    stop_grace_period: 30s
    ports:
      - "5335:53/udp"
      - "5335:53/tcp"
    restart: always

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    network_mode: host
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_API_PASSWORD}
    volumes:
      - ${PIHOLE_PATH}:/etc/pihole
    stop_grace_period: 30s
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    depends_on:
      - unbound
    restart: always
