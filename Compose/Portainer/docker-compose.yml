services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:sts
    restart: no
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/villacus/Homelab/Compose/Portainer/portainer_data:/data
    ports:
      - 9000:9000

volumes:
  portainer_data:
    name: portainer_data

networks:
  default:
    name: portainer_network
