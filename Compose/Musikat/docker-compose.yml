name: musikat

services:
  musikat:
    # Arcane debe tener habilitado BuildKit para clonar este contexto Git.
    build:
      context: https://github.com/soggy8/musikat.git#main
      dockerfile: Dockerfile
    container_name: musikat
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    ports:
      - '${MUSIKAT_PORT:-8010}:8000'
    volumes:
      # The three Navidrome roots are exposed as separate Musikat destinations.
      - ${MUSIKAT_MUSIC_PATH:-/mnt/nasdisk/privada/Musica}:/music/main:rw
      - ${MUSIKAT_ITZIAR_MUSIC_PATH:-/mnt/nasdisk/compartida/Musica}:/music/itziar:rw
      - ${MUSIKAT_JONPA_MUSIC_PATH:-/mnt/nasdisk/privada/Musica_jon}:/music/jonpa:rw
      # Temporary download files are kept outside the container.
      - ${MUSIKAT_DOWNLOADS_PATH:-/home/villacus/musikat/downloads}:/app/downloads:rw
      # YouTube cookies are optional; add the bind and YOUTUBE_COOKIES_PATH in Arcane if needed.
    environment:
      FORWARDED_ALLOW_IPS: '*'
      TZ: ${TZ:-Europe/Madrid}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      DEFAULT_METADATA_PROVIDER: ${DEFAULT_METADATA_PROVIDER:-deezer}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-http://localhost:8010/callback}
      NAVIDROME_MUSIC_PATH: /music/jonpa
      NAVIDROME_MUSIC_PATHS: ${NAVIDROME_MUSIC_PATHS:-/music/main,/music/itziar,/music/jonpa}
      NAVIDROME_MUSIC_LABELS: ${NAVIDROME_MUSIC_LABELS:-Musica,Itziar,Jonpa}
      NAVIDROME_API_URL: ${NAVIDROME_API_URL:-http://host.docker.internal:4533}
      NAVIDROME_USERNAME: ${NAVIDROME_USERNAME:-}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
      NAVIDROME_SYNC_ENABLED: ${NAVIDROME_SYNC_ENABLED:-false}
      NAVIDROME_SYNC_INTERVAL_HOURS: ${NAVIDROME_SYNC_INTERVAL_HOURS:-4}
      NAVIDROME_SYNC_INITIAL_DELAY_SEC: ${NAVIDROME_SYNC_INITIAL_DELAY_SEC:-120}
      NAVIDROME_SYNC_API_DELAY_SEC: ${NAVIDROME_SYNC_API_DELAY_SEC:-0.12}
      DOWNLOAD_DIR: ${DOWNLOAD_DIR:-/app/downloads}
      OUTPUT_FORMAT: ${OUTPUT_FORMAT:-mp3}
      AUDIO_QUALITY: ${AUDIO_QUALITY:-128}
      TEMP_FILE_CLEANUP_DELAY_SEC: ${TEMP_FILE_CLEANUP_DELAY_SEC:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8010,http://127.0.0.1:8010,http://192.168.0.9:8010}
    user: ${PUID:-1000}:${PGID:-1000}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8010,http://127.0.0.1:8010,http://192.168.0.9:8010,https://musikat.tailf45616.ts.net}
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health")']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - music-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

networks:
  music-network:
    driver: bridge
