---

server:
  port: 8080

branding:
  app-name: "VillaLab"
  logo-text: "V"

theme:
  background-color: 230 20 8
  primary-color: 250 70 65
  positive-color: 140 55 55
  negative-color: 355 65 60
  contrast-multiplier: 1.15

pages:
  - name: VillaLab
    columns:

      # ---------------- COLUMNA IZQUIERDA (small) ----------------
      - size: small
        widgets:
          - type: search
            search-engine: https://search.brave.com/search?q={QUERY}
            new-tab: true
            autofocus: true

          - type: server-stats
            title: Servidor VillaLab
            servers:
              - type: local
                name: villacus

          - type: custom-api
            title: UPS MF-UPS650VA
            cache: 10s
            url: http://172.17.0.1:8083/
            template: |
              {{ if .JSON.Exists "battery_charge" }}
              <div class="flex justify-between text-center">
                <div>
                  <div class="color-highlight size-h3">{{ .JSON.Int "battery_charge" }}%</div>
                  <div class="size-h6">BATERÍA</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ .JSON.Int "ups_load" }}%</div>
                  <div class="size-h6">CARGA</div>
                </div>
                <div>
                  <div class="color-positive size-h3">{{ .JSON.String "ups_status" }}</div>
                  <div class="size-h6">ESTADO</div>
                </div>
              </div>
              {{ else }}
              <p class="size-h4 color-negative">UPS no disponible</p>
              {{ end }}
      # ---------------- COLUMNA CENTRAL (full) ----------------
      - size: full
        widgets:
          - type: group
            title: VillaLab
            widgets:
              - type: docker-containers
                title: Contenedores
                format-container-names: true
                running-only: false
                containers:
                  homepage:
                    name: Homepage
                    icon: di:homepage
                    hide: true
                  speedtest:
                    name: Speedtest
                    icon: si:speedtest
                    url: https://speedtest.tailf45616.ts.net
                    description: Medidor de velocidad
                  vaultwarden:
                    name: Vaultwarden
                    icon: si:vaultwarden
                    url: https://vaultwarden.tailf45616.ts.net
                    description: Gestor de contraseñas
                  nextcloud_app:
                    name: Nextcloud
                    icon: si:nextcloud
                    url: https://nextcloud.tailf45616.ts.net
                    description: Nube personal
                  nextcloud_cron:
                    hide: true
                  nextcloud_db:
                    hide: true
                  nextcloud_redis:
                    hide: true
                  samba:
                    name: Samba
                    icon: mdi:folder-network
                    description: Compartición NAS
                  navidrome:
                    name: Navidrome
                    icon: mdi:music-note
                    url: https://navidrome.tailf45616.ts.net
                    description: Servidor de música
                  musikat:
                    name: Musikat
                    icon: mdi:music-box-multiple
                    url: https://musikat.tailf45616.ts.net
                    description: Descargas de música
                  immich_server:
                    name: Immich
                    icon: si:immich
                    url: https://immich.tailf45616.ts.net
                    description: Fotos y vídeos
                  immich_postgres:
                    hide: true
                  immich_redis:
                    hide: true
                  pihole:
                    name: Pi-hole
                    icon: si:pihole
                    url: https://pihole.tailf45616.ts.net/admin/login
                    description: DNS + adblock
                  unbound:
                    name: Unbound
                    icon: mdi:dns
                    description: Resolver DNS recursivo
                  arcane:
                    name: Arcane
                    icon: mdi:docker
                    url: https://arcane.tailf45616.ts.net
                    description: Gestión de Docker
                  paperless:
                    name: Paperless
                    icon: mdi:file-document-multiple
                    url: https://paperless-ngx.tailf45616.ts.net
                    description: Gestión de documentos
                  jellyfin:
                    name: Jellyfin
                    icon: si:jellyfin
                    url: https://jellyfin.tailf45616.ts.net
                    description: Servidor multimedia
                  sonarr:
                    name: Sonarr
                    icon: mdi:television
                    url: https://sonarr.tailf45616.ts.net
                    description: Gestión de series
                  radarr:
                    name: Radarr
                    icon: mdi:filmstrip
                    url: https://radarr.tailf45616.ts.net
                    description: Gestión de películas
                  prowlarr:
                    name: Prowlarr
                    icon: mdi:magnify
                    url: https://prowlarr.tailf45616.ts.net
                    description: Indexador
                  qbittorrent:
                    name: qBittorrent
                    icon: mdi:download
                    url: https://qbittorrent.tailf45616.ts.net
