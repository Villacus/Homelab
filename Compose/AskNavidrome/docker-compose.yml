services:
  caddy:
    image: caddy:alpine
    container_name: caddy-asknavidrome
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    ports:
      - "${CADDY_PORT}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - asknavidrome
      - navidrome

  asknavidrome:
    image: ghcr.io/rosskouk/asknavidrome:latest
    container_name: asknavidrome
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      - NAVI_SKILL_ID=${NAVI_SKILL_ID}
      - NAVI_URL=${NAVI_URL}
      - NAVI_USER=${NAVI_USER}
      - NAVI_PASS=${NAVI_PASS}
      - NAVI_SONG_COUNT=${NAVI_SONG_COUNT}
      - NAVI_PORT=${NAVI_PORT}
      - NAVI_API_PATH=${NAVI_API_PATH}
      - NAVI_API_VER=${NAVI_API_VER}
      - NAVI_DEBUG=${NAVI_DEBUG}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    ports:
      - "${NAVIDROME_PORT}:4533"
    environment:
      - TZ=${TZ}
      - NMUSICFOLDER=/music
      - DATAFOLDER=/data
    volumes:
      - ${NAVIDROME_DATA_PATH}:/data
      - ${NAVIDROME_MUSIC_PATH}:/music:ro

volumes:
  caddy_data:
