name: satisfactory

services:
  satisfactory-server:
    container_name: satisfactory-server
    build: ./build
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${SATISFACTORY_PORT}:7777/udp"
      - "${SATISFACTORY_PORT}:7777/tcp"
      - "${SATISFACTORY_WEB_PORT}:8888/tcp"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - ALWAYS_UPDATE_ON_START=true
      - EXTRA_PARAMS=-log -unattended -ini:Engine:[HTTPServer.Listeners]:DefaultBindAddress=any
    volumes:
      - ${SERVICE_CONFIG}/data:/satisfactory
      - ${SERVICE_CONFIG}/config:/home/steam/.config/Epic
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 16G
        reservations:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
