name: nginx

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      TZ: ${TZ}
    ports:
      - '${NGINX_HTTP_PORT}:80'
      - '${NGINX_HTTPS_PORT}:443'
      - '${NGINX_ADMIN_PORT}:81'
    volumes:
      - ${NGINX_DATA_PATH}:/data
      - ${NGINX_LETSENCRYPT_PATH}:/etc/letsencrypt
    networks:
      - music-network
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    restart: unless-stopped

networks:
  music-network:
    name: ${MUSIC_NETWORK}
    external: true
