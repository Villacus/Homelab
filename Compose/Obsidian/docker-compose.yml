name: obsidian

services:
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${OBSIDIAN_CONFIG_PATH}:/config
    ports:
      - ${OBSIDIAN_HTTP_PORT}:3000
      - ${OBSIDIAN_HTTPS_PORT}:3001
    shm_size: "1gb"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    restart: unless-stopped
