services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    restart: always
    stop_grace_period: 30s
    volumes:
      - ${VAULTWARDEN_PATH}:/data
    environment:
      - DOMAIN=https://vaultwarden.tailf45616.ts.net
      - SIGNUPS_ALLOWED=true
    ports:
      - ${VAULTWARDEN_PORT}:80
