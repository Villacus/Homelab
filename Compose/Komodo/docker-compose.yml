name: komodo

services:
  komodo-db:
    image: ghcr.io/ferretdb/ferretdb:1
    container_name: komodo-db
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    restart: unless-stopped
    user: "0:0"
    volumes:
      - komodo-db-data:/data
    environment:
      - FERRETDB_HANDLER=sqlite
      - FERRETDB_SQLITE_URL=file:/data/

  komodo-core:
    image: ghcr.io/moghtech/komodo-core:latest
    container_name: komodo-core
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    restart: unless-stopped
    init: true
    ports:
      - ${KOMODO_PORT}:9120
    depends_on:
      - komodo-db
    volumes:
      - ${DOCKER_SOCKET}:/var/run/docker.sock
      - ${KOMODO_PATH}:/config
    environment:
      - TZ=${TZ}
      - KOMODO_DATABASE_ADDRESS=komodo-db
      - KOMODO_LOCAL_AUTH=true
      - KOMODO_ENABLE_NEW_USERS=true
      - KOMODO_JWT_SECRET=${KOMODO_JWT_SECRET}

  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:latest
    container_name: komodo-periphery
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PERIPHERY_STACK_DIR=/configs/app/stacks
    ports:
      - "${PERIPHERY_PORT}:8120"
    volumes:
      - ${DOCKER_SOCKET}:/var/run/docker.sock
      - ${KOMODO_PATH}/stacks:/configs/app/stacks

volumes:
  komodo-db-data:
