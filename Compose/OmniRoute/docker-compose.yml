name: omniroute

services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    ports:
      - "${OMNIROUTE_PORT}:20128"
    environment:
      - TZ=${TZ}
    volumes:
      - ${OMNIROUTE_DATA}:/home/node/.omniroute
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
