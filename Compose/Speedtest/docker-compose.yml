services:
  speedtest:
    image: openspeedtest/latest
    container_name: speedtest
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    ports:
      - ${SPEEDTEST_PORT}:3000
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    restart: unless-stopped