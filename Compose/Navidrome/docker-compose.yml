name: navidrome

services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      - TZ=${TZ}
      - NMUSICFOLDER=/music
      - DATAFOLDER=/data
      - ND_BASEURL=${ND_BASEURL}
    ports:
      - "${NAVIDROME_PORT}:4533"
    stop_grace_period: 30s
    volumes:
      - ${NAVIDROME_DATA_PATH}:/data
      - ${NAVIDROME_MUSIC_PATH}:/music:ro
      - ${NAVIDROME_ITZIAR_MUSIC_PATH}:/itziar_music:ro
      - ${NAVIDROME_JONPA_MUSIC_PATH}:/jonpa_music:ro
    user: ${NAVIDROME_UID}:${NAVIDROME_GID}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    restart: unless-stopped
    networks:
      - music-network

networks:
  music-network:
    name: ${MUSIC_NETWORK}
    external: true
