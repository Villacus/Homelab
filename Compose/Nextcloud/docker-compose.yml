services:
  db:
    image: postgres:16-alpine
    container_name: nextcloud_db
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    environment:
      - POSTGRES_DB=${NC_DB_NAME}
      - POSTGRES_USER=${NC_DB_USER}
      - POSTGRES_PASSWORD=${NC_DB_PASSWORD}
    stop_grace_period: 30s
    volumes:
      - ${NEXTCLOUD_PATH}/db:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: nextcloud_redis
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    restart: unless-stopped

  app:
    image: nextcloud:33.0.10-apache
    container_name: nextcloud_app
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${NC_DB_NAME}
      - POSTGRES_USER=${NC_DB_USER}
      - POSTGRES_PASSWORD=${NC_DB_PASSWORD}
      - REDIS_HOST=redis
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=192.168.0.9 nextcloud.tailf45616.ts.net pilla.tailf45616.ts.net
      - OVERWRITEPROTOCOL=https
      - OVERWRITEWEBROOT=/nextcloud
      - PHP_UPLOAD_LIMIT=2G
      - PHP_MEMORY_LIMIT=512M
    volumes:
      - ${NEXTCLOUD_PATH}/html:/var/www/html
      - ${NAS_PATH}/privada:/mnt/privada:rw
      - ${NAS_PATH}/compartida:/mnt/compartida:rw
    ports:
      - ${NEXTCLOUD_PORT}:80
    depends_on:
      - db
      - redis
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    restart: unless-stopped
    networks:
      - default
      - music-network

  cron:
    image: nextcloud:33.0.5-apache
    container_name: nextcloud_cron
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    volumes:
      - ${NEXTCLOUD_PATH}/html:/var/www/html
    entrypoint: /cron.sh
    depends_on:
      - db
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    restart: unless-stopped

networks:
  music-network:
    name: music-network
    external: true
